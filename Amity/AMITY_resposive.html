<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amity-Admissions</title>
</head>
<style>
    .text-box2 {

        position: absolute;
        bottom: 10%;
        left: 1%;
        top: 20%;


    }

    .logo-box {
        background-color: #1e3a5f;
        /* dark blue */
        border-radius: 15px;
    }

    .card-layout {
        border-radius: 15px;
        background-color: white;
        position: absolute;
        right: 15%;
        bottom: 0%;
        width: 350px;
    }

    .submit-btn {
        width: 280px;
        /* adjust as needed */
        padding: 12px 0;
        border-radius: 999px;
        /* pill shape */
        border: 1.5px solid #999;
        background-color: #f1f1f1;
        color: #8a8a8a;
        font-size: 18px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease-in-out;

    }

    .text-box {

        position: relative;

    }
</style>

<body>
    <div class="container-fluid">
        <div class="row g-2 g-md-2 g-lg-3">
            <div class="col">
                <div class="navbar navbar-expand-lg logo-box mt-lg-3 mx-md-1 mx-lg-3 py-md-3">
                    <img src="./logo.png" alt="Logo" height="50px" width="auto" />

                    <a href="index.html" class="btn btn-warning ml-auto rounded-pill px-4 py-2 text-black">ENQUIRE
                        NOW <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
        <div class="row g-2 g-md-2 g-lg-3">
            <div class="col">
                <a href="./form.html"
                    class="bg-warning text-dark text-center mt-sm-5 mt-md-3 mt-lg-4 mx-md-1 mx-lg-3 rounded nav-link">
                    Jan'26 Session Admissions Open Now
                </a>
            </div>
        </div>
        <div class="row g-2 g-md-2 g-lg-3">
            <div class="col">
                <div class="logo-box text-box mt-3 mx-lg-3 mx-md-1 overflow-hidden"
                    style="min-height: 550px; padding: 3rem;">
                    <h2 class="text-box2"
                        style="font-family: Georgia, serif; font-size: 2.4rem; line-height: 1.4; color: white; position: relative;">
                        Unlock Global Learning <br>
                        With Our Innovative <br>
                        Online Degree Programs
                    </h2>
                    <div style="height: 100%; width: 50%;">
                        <div class="bg-warning rounded-circle position-absolute overflow-hidden d-flex align-items-end justify-content-evenly"
                            style="width: 320px; height: 320px; right: -40px; bottom: -80px;">
                            <img src="./student_bg_yellow.png" alt="Student"
                                style="height: 100%; width: auto; object-fit: cover;">
                        </div>
                        <div class="card d-none d-lg-block card-layout">
                            <div class="card-header">
                                <h5 class="card-title"
                                    style="font-family:'Times New Roman', Times, serif; font-size: 1.6rem; color:#1e3a5f; text-align: center;">
                                    Enquire
                                    Now
                                </h5>
                            </div>
                            <div class="card-body">
                                <form action="">
                                    <div class="form-group">
                                        <label for="name">Full Name*</label>
                                        <input type="text" class="form-control" placeholder="Enter your full name">
                                    </div>
                                    <div class="form-group">
                                        <label for="email">Email address*</label>
                                        <input type="email" class="form-control" placeholder="abc@xyz.com">
                                    </div>
                                    <div class="form-group">
                                        <label for="phone">Phone number*</label>
                                        <input type="tel" class="form-control" placeholder="Enter your no.">
                                    </div>
                                    <div class="d-flex align-items-start pb-3">
                                        <input type="radio" name="agreement" id="agreement" class="mt-1 mr-2">
                                        <label for="agreement" style="font-size: 0.6rem; margin-bottom: 0;">By entering
                                            these details I agree that Amity University Online and its associates can
                                            contact me with updates & notifications via Email, SMS, WhatsApp, and Voice
                                            call as per the <a href="#">Privacy Policy</a>. This consent will override
                                            any registration for DNC / NDNC.</label>
                                    </div>
                                </form>
                            </div>
                            <div class="card-footer text-center">
                                <button class="btn submit-btn"> Submit </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>




</body>

</html>
