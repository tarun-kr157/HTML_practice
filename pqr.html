<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bootstrap.css">
</head>
<style>
    .parent {
        width: 100%;
        height: 100px;
        position: relative;
        background: #eee;
    }

    .child {
        position: absolute;
        top: 50%;
        left: 50%;
        /* The Magic Duo */
        transform: translate(-50%, -50%);
        background: #007bff;
        color: white;
        padding: 10px 20px;
    }
</style>

<body>
    <div class="parent">
        <div class="child">I am perfectly centered</div>
    </div>
</body>

</html>
